{% extends "base.html" %}

{% block title %}{% if address %}Edit{% else %}Add{% endif %} Address{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 form-card">
    <div class="card-body p-4">
        <h3 class="mb-4">{% if address %}Edit{% else %}Add{% endif %} Delivery Address</h3>
        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Label</label>
                    <input name="label" class="form-control" value="{{ address.label|default:'Home' }}" placeholder="Home, Work..." required>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Recipient name</label>
                    <input name="recipient_name" class="form-control" value="{{ address.recipient_name|default:request.user.get_full_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone number</label>
                    <input type="tel" name="phone" class="form-control" value="{{ address.phone|default:customer.phone }}" maxlength="20" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Postal code</label>
                    <input name="postal_code" class="form-control" value="{{ address.postal_code|default:'' }}" maxlength="20" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Full address</label>
                    <textarea name="address_line" class="form-control" rows="3" required>{{ address.address_line|default:'' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">City</label>
                    <input name="city" class="form-control" value="{{ address.city|default:'' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">State</label>
                    <input name="state" class="form-control" value="{{ address.state|default:'' }}" required>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_default" id="is_default" class="form-check-input" {% if address.is_default %}checked{% endif %}>
                        <label for="is_default" class="form-check-label">Make this my default delivery address</label>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <button class="btn btn-danger">Save Address</button>
                <a href="{% if next == 'cart' %}{% url 'cart_detail' %}{% else %}{% url 'profile' %}{% endif %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
